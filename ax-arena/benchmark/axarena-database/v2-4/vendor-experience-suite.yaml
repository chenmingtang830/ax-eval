formal: false
status: frozen
primary_unit: vendor
surface: cli
vendors: [cockroachdb, insforge, neon, nile, supabase, turso]
model_strata:
  - model: google/gemini-3.7-flash-20260813
    provider: google-vertex
  - model: qwen/qwen3.8-27b-20260814
