known_environment_debt:
  - >-
    Cockroach execution must reject localhost or a locally bootstrapped server
    and assert the intended hosted cluster identity before a future model trial.
  - >-
    A malformed role from a pre-RC interrupted Cockroach pilot remains externally
    blocked; current credentials cannot remove it. It is outside frozen short
    run namespaces and requires cluster-admin cleanup before hosted publication.
