  - model: qwen/qwen3.8-27b-20260814
    provider: akashml
  - model: moonshotai/kimi-k3
    provider: moonshotai
trial_count: 2
task_selection_policy: >-
  Tasks are selected only from documented, controller-witnessed candidate work
  and the frozen V2.2 native-journey anchor. Vendor-specific unsupported tuples
  remain structural-na; outcomes from V2.2 do not select, drop, or weight tasks.
scoring:
  primary: equal-weight macro mean of task-family pass@1 over valid cells
  secondary:
    - task-family pass rate
    - trial stability
    - discovery, connection, operation, and recovery diagnostics
    - latency, first-action latency, tool and route volume, and cost
  reporting: vendors are rows; models are secondary stability strata
admission_requirements:
  - documented-native-path
  - exact-sandbox-scope
  - independent-pre-cleanup-readback
  - exact-scope-cleanup
  - valid-trace-and-pinned-route
  - full-file-human-pack-approval-before-freeze
