      marker strings and row data; only SQL identifiers need identifier quoting.

      SUPABASE CLI-ONLY EXTENSION CONTRACT: This extension admits exactly one
      surface: the PostgreSQL data plane through the declared `psql`
      command-line tool and `process.env.SUPABASE_DB_URL`.

      Do not use Supabase REST/PostgREST, dashboard actions, Supabase
      control-plane API calls, SDKs, or a local database. Use `psql` for
