    anchor: false
  - id: db-T15-database-branching
    title: "T15: Database/Backend Branching"
    difficulty: L1
    skill: database-branching
    intent: Using the vendor's documented CLI mechanism for database/backend
      branching, perform one deterministic, task-scoped operation on a resource
      named `axarena_database-branching_{ns}` and leave the resulting state
      available for independent read-back. Do not use a management API or
      disclose implementation-specific commands.
    oracle_hint: Read back the task-scoped resource
      `axarena_database-branching_{ns}` through the vendor's documented
      CLI/data-plane surface and verify the requested database/backend branching
      state is present, including any negative or preservation condition
      required by the task.
    allowed_surfaces:
      - cli
    na_examples:
      - This vendor does not expose database/backend branching on the admitted
        CLI surface.
    execution_family: lifecycle-recovery
    challenge_tags:
      - recoverable-fault
      - recovery
      - constraint-preservation
    discovery_reset: family
    controller_fixture_ref: database/database-branching
    supported_vendors:
      - Insforge
      - Neon
      - Supabase
      - Turso
    task_fit_vendors: []
    anchor: false
  - id: db-T16-data-integrity-and-transactions
    title: "T16: Enforce one integrity or atomicity rule"
    difficulty: L4
    skill: data-integrity-and-transactions
    intent: Create a container named `axarena_integrity_{ns}` with an integrity rule
      or atomic write guarantee on `external_id`. Commit one valid record using
      `external_id=primary_{ns}`. Then perform one conflicting or invalid write
      that should not leave a second committed record with the same logical key.
    oracle_hint: Read back `axarena_integrity_{ns}` and confirm only the valid
      `external_id=primary_{ns}` record is durably committed. The verifier must
      itself issue one conflicting or invalid write against the same logical key
      and re-read to confirm a second committed row was not created — do not
      rely solely on the agent reporting that the conflict failed.
    allowed_surfaces:
      - cli
    na_examples:
      - This vendor cannot enforce a documented integrity rule or atomic write
        guarantee on api/cli surfaces.
    execution_family: schema-integrity
    challenge_tags:
      - multi-step-state
      - constraint-preservation
      - negative-verification
    discovery_reset: family
    controller_fixture_ref: database/data-integrity-and-transactions
    supported_vendors:
      - Cockroachdb
      - Insforge
      - Nile
      - Supabase
      - Turso
    task_fit_vendors:
      - Cockroachdb
      - Turso
    anchor: false
scoring:
  per_task: pass | fail | na
  overall:
    formula: score = sum(passes) / sum(non_na_tasks)
    notes: N/A tasks (and N/A surfaces within a task) are excluded from both
      numerator and denominator. Support-matrix unsupported cells are N/A, not
      fail. Cross-vendor comparisons are valid only across tasks/surfaces both
      vendors actually run. Publication should also report intersection/core
      score, applicability coverage, and the full task×surface matrix — do not
      treat applicable pass rate as the sole leaderboard number.
  layers:
    static_ax: Discoverability & Readiness is published separately and never alters
      usability-suite pass rates.
    behavioral: Usability Canonical Suite is scored only from verified outcomes on
      api/cli for AXArena-Database v1; SDK remains a deferred future surface and
      any existing SDK runs are research artifacts, not benchmark-of-record
      cells.
