name: CANDIDATE-SUITE-V2-1
version: 1
category: database
description: Bottom-up-derived canonical task suite for the "database" category,
  synthesized from 6 vendors' cited documentation (see
  candidate-suite-v2-1.synthesis.md for the full audit trail).
methodology:
  schema: ax.suite-methodology/v1
  ontology:
    task: A single benchmark problem with fixed intent and success criteria.
    trial: One attempt at a task under a clean environment.
    grader: Logic that scores either an outcome or transcript-derived property.
    transcript: Behavior evidence from the agent run, including tool use and
      intermediate steps.
    outcome: Final world state in the environment after a trial.
    support_decision: A recorded judgment about whether a vendor/surface can perform a task.
    selection_decision: A recorded judgment about whether a concept becomes part of
      the canonical suite.
    suite: The frozen canonical task bank for a category.
    publication_bundle: The artifact bundle tying methodology, adapters, evidence,
      and results together.
  static_ax:
    label: Discoverability & Readiness
    dimensions:
      - discoverability
      - content quality
      - capability exposure
      - protocol/access readiness
    notes:
      - Discoverability & Readiness is a publication/audit layer and never
        changes usability-suite pass rates.
  behavioral:
    label: Usability Canonical Suite
    source_of_truth: Verified world state read back from the live product
    notes:
      - Usability-suite scoring is governed only by verified task outcomes on
        the suite-declared benchmark surfaces.
  extraction_requirements:
    - Use only official vendor documentation as evidence.
    - Persist every extracted capability with structured evidence objects.
    - Document supported benchmark surfaces where evidence exists; deferred
      surfaces may still be retained as research metadata.
  surface_scope:
    - cli
  min_vendor_coverage_pct: 0.75
  target_task_count: 16
  verifiability_requirement: Selected tasks must have deterministic read-back
    verification against world state.
  difficulty_rubric:
    L1: "Single action: one create/read/update/check call with minimal setup."
    L2: "Single capability with configuration or composition: ACL, vector search
      index, etc."
    L3: "Multi-step workflow within one domain: schema evolution, server-side
      routine."
    L4: "Full lifecycle or cross-cutting operational workflow: backup/restore, CDC,
      integrity constraints."
  human_review_checkpoints:
    - "bottom-up pipeline review: capability inventory → concept universe →
      coverage matrix → selection ledger → task drafts"
    - final suite freeze
    - publication bundle release
tasks:
  - id: db-T17-cli-session-discovery
    title: "T17: Discover and verify an authenticated CLI session"
    difficulty: L2
    skill: cli-session-discovery
    intent: From a fresh family session, discover the vendor's documented
      command-line entrypoint and authentication path. Using the provisioned
      sandbox credentials, create a task-scoped relation named
      `axarena_session_probe_{ns}` with one marker `session_{ns}` and the
      authenticated principal observed by the CLI session, then start a second
      fresh CLI process and read the marker back. Report the discovered surface,
      auth method, relation name, and marker; never print credentials or clean
      up the relation.
    oracle_hint: Read back `axarena_session_probe_{ns}` through an independent fresh
      SQL connection and confirm exactly one row has marker `session_{ns}` and a
      non-empty principal. The agent's claimed CLI discovery text is not
      sufficient without this world-state read-back.
    allowed_surfaces:
      - cli
    na_examples:
      - This vendor does not expose a documented authenticated CLI/SQL
        data-plane path for the benchmark sandbox.
    execution_family: access-auth-discovery
    challenge_tags:
      - surface-ambiguity
      - negative-verification
    discovery_reset: family
    controller_fixture_ref: database/cli-session-discovery
    supported_vendors:
      - Cockroachdb
      - Insforge
      - Neon
      - Nile
      - Supabase
    task_fit_vendors:
      - Cockroachdb
      - Insforge
      - Neon
      - Nile
      - Supabase
    anchor: false
  - id: db-T21-cli-principal-continuity
    title: "T21: Verify authenticated principal continuity across CLI sessions"
    difficulty: L2
    skill: cli-principal-continuity
    intent: From a fresh family session, discover the documented CLI SQL path and
      create `axarena_principal_probe_{ns}` with one marker `principal_{ns}` and
      the non-empty authenticated principal returned by the session. Start a
      second fresh CLI process, read the row back, and report the same principal
      without printing credentials or cleaning up.
    oracle_hint: Read back `axarena_principal_probe_{ns}` through an independent
      fresh SQL connection and confirm exactly one marker row has a non-empty
      principal. The two CLI sessions must report the same principal in the
      trace.
    allowed_surfaces:
      - cli
    na_examples:
      - This vendor does not expose a documented authenticated CLI/SQL path for
        principal continuity.
    execution_family: access-auth-discovery
    challenge_tags:
      - surface-ambiguity
      - negative-verification
    discovery_reset: family
    controller_fixture_ref: database/cli-principal-continuity
    supported_vendors:
      - Cockroachdb
      - Insforge
      - Neon
      - Nile
      - Supabase
    task_fit_vendors:
      - Cockroachdb
      - Insforge
      - Neon
      - Nile
      - Supabase
    anchor: false
  - id: db-T18-constraint-preservation
    title: "T18: Preserve a constraint under a rejected write"
    difficulty: L2
    skill: constraint-preservation
    intent: From a fresh family session, discover the documented CLI SQL path and
      create `axarena_constraint_probe_{ns}` with a primary key and a unique
      marker constraint. Insert exactly one marker `constraint_{ns}`, then
      deliberately attempt the same marker again using the vendor's documented
      conflict/rejection path. Leave the original row intact and report the
      relation and rejected-write outcome; do not disable or replace the
      constraint.
    oracle_hint: Read back the relation through an independent fresh SQL connection
      and confirm exactly one `constraint_{ns}` row exists, the primary/unique
      constraint is present in metadata, and the duplicate attempt did not
      create a second row.
    allowed_surfaces:
      - cli
    na_examples:
      - This vendor does not expose a documented CLI SQL path for defining and
        enforcing the required constraint.
    execution_family: schema-integrity
    challenge_tags:
      - multi-step-state
      - constraint-preservation
      - negative-verification
    discovery_reset: family
    controller_fixture_ref: database/constraint-preservation
    supported_vendors:
      - Cockroachdb
      - Insforge
      - Neon
      - Nile
      - Supabase
      - Turso
    task_fit_vendors:
      - Cockroachdb
      - Insforge
      - Neon
      - Nile
      - Supabase
      - Turso
    anchor: false
  - id: db-T19-transactional-record-recovery
    title: "T19: Recover a record after a rolled-back transaction"
    difficulty: L4
    skill: transactional-record-recovery
    intent: From a fresh family session, discover the documented CLI SQL path and
      create `axarena_txn_probe_{ns}`. Start a transaction that inserts
      `rollback_{ns}` and roll it back, then commit exactly one `committed_{ns}`
      row in a separate transaction. Report the observed rollback and commit
      behavior without cleaning up the relation.
    oracle_hint: Read back the relation through an independent fresh SQL connection
      and confirm zero `rollback_{ns}` rows and exactly one `committed_{ns}`
      row. The final committed state must prove the earlier mutation was
      actually rolled back.
    allowed_surfaces:
      - cli
    na_examples:
      - This vendor does not expose a documented CLI SQL transaction path with
        rollback and commit semantics.
    execution_family: lifecycle-recovery
    challenge_tags:
      - recoverable-fault
      - recovery
      - constraint-preservation
    discovery_reset: family
    controller_fixture_ref: database/transactional-record-recovery
    supported_vendors:
      - Cockroachdb
      - Insforge
      - Neon
      - Nile
      - Supabase
      - Turso
    task_fit_vendors:
      - Cockroachdb
      - Insforge
      - Neon
      - Nile
      - Supabase
      - Turso
    anchor: false
  - id: db-T20-aggregate-query
    title: "T20: Aggregate a filtered record set"
    difficulty: L2
    skill: aggregate-query
    intent: "From a fresh family session, discover the documented CLI SQL path and
      create `axarena_aggregate_probe_{ns}` with three rows: two `active` rows
      and one `inactive` row. Run a filtered aggregate that counts only the
      active rows and report the relation and count without cleaning it up."
    oracle_hint: Read back the relation through an independent fresh SQL connection
      and confirm three total rows, exactly two active rows, and an aggregate
      count of two for the active predicate.
    allowed_surfaces:
      - cli
    na_examples:
      - This vendor does not expose a documented CLI SQL aggregate/query path.
    execution_family: query-search
    challenge_tags:
      - multi-step-state
      - negative-verification
    discovery_reset: family
    controller_fixture_ref: database/aggregate-query
    supported_vendors:
      - Cockroachdb
      - Insforge
      - Neon
      - Nile
      - Supabase
      - Turso
    task_fit_vendors:
      - Cockroachdb
      - Insforge
      - Neon
      - Nile
      - Supabase
      - Turso
    anchor: false
  - id: db-T22-negative-query-verification
    title: "T22: Verify a Negative Query Without Losing Existing Records"
    difficulty: L2
    skill: negative-query-verification
    intent: From a fresh family session, discover the documented CLI SQL path and
      create `axarena_negative_query_probe_{ns}` with two marker rows. Run a
      query for a marker that does not exist, confirm the negative result, then
      report the relation and the preserved record count without cleaning up.
    oracle_hint: Read back the relation through an independent fresh SQL connection
      and confirm both original rows remain and the negative predicate returns
      zero rows.
    allowed_surfaces:
      - cli
    na_examples:
      - This vendor does not expose a documented CLI SQL query path for negative
        verification.
    execution_family: query-search
    challenge_tags:
      - multi-step-state
      - negative-verification
    discovery_reset: family
    controller_fixture_ref: database/negative-query-verification
    supported_vendors:
      - Cockroachdb
      - Insforge
      - Neon
      - Nile
      - Supabase
    task_fit_vendors:
      - Cockroachdb
      - Insforge
      - Neon
      - Nile
      - Supabase
    anchor: false
  - id: db-T07-backup-and-restore
    title: "T07: Produce a backup, snapshot, or export artifact"
    difficulty: L4
    skill: backup-and-restore
    intent: Create or use a container named `axarena_backup_{ns}` with one marker
      record labeled `marker_{ns}`, then produce a backup, snapshot, or export
      artifact using the vendor's idiomatic recovery or export mechanism.
    oracle_hint: Read back the backup, snapshot, or export artifact and confirm (1)
      its metadata references `axarena_backup_{ns}` or the producing job, and
      (2) the artifact payload, listing, or restore-preview includes the marker
      record labeled `marker_{ns}` — metadata-only existence is not enough.
    allowed_surfaces:
      - cli
    na_examples:
      - This vendor does not expose a backup, snapshot, or export flow on
        api/cli surfaces.
    execution_family: lifecycle-recovery
    challenge_tags:
      - recoverable-fault
      - recovery
      - constraint-preservation
    discovery_reset: family
    controller_fixture_ref: database/backup-and-restore
    supported_vendors:
      - Cockroachdb
      - Insforge
      - Neon
      - Nile
      - Supabase
      - Turso
    task_fit_vendors:
      - Cockroachdb
      - Neon
      - Supabase
      - Turso
    anchor: false
  - id: db-T02-evolve-schema
    title: "T02: Apply a schema evolution"
    difficulty: L3
    skill: evolve-schema
    intent: In the task-scoped container `axarena_migrate_{ns}`, first establish a
      baseline schema containing a `title` field (create it if it does not
      already exist). Then apply an idiomatic schema evolution that adds a new
      `status` field without recreating or replacing the container. Confirm the
      evolved shape is visible through the vendor's schema or metadata surface.
    oracle_hint: Read back metadata for `axarena_migrate_{ns}` and confirm the added
      `status` field is now present and the pre-existing `title` field remains
      visible.
    allowed_surfaces:
      - cli
    na_examples:
      - This vendor does not support a documented schema evolution or migration
        flow on api/cli surfaces.
    execution_family: schema-integrity
    challenge_tags:
      - multi-step-state
      - constraint-preservation
      - negative-verification
    discovery_reset: family
    controller_fixture_ref: database/evolve-schema
    supported_vendors:
